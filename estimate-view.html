<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외연수 견적서 · 비즈페이지</title>
<!-- 🔴 검색엔진에 실리면 안 된다 (WN). 이 링크에는 **인증이 없고**(WC), 고객이
     결재권자에게 넘기는 것이 정상 동선이다. 그 링크가 블로그·카페에 한 번이라도
     붙으면 크롤러가 따라와 **남의 견적서가 검색 결과에 뜬다.**
     ⚠ robots.txt에 적어 막지 않는다 — robots.txt는 공개 문서라 「여기 견적서가
       있다」고 알려주는 꼴이 된다. 페이지가 스스로 말하게 한다. -->
<meta name="robots" content="noindex, nofollow" />
<!-- 공유 미리보기 — 카카오톡·메신저로 링크를 보낼 때 뜨는 카드.
     🔴 **여기에 견적 내용을 넣지 않는다.** 미리보기는 링크를 받은 사람 누구에게나
       보인다 — 고객사명·금액이 카드에 찍히면 그게 곧 유출이다. 그래서 이 값들은
       **정적 문구**다(payload를 읽지 않는다). WC에서 연락처를 payload에 안 넣은 것과 같은 결. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="비즈페이지" />
<meta property="og:title" content="해외연수 견적서 · 비즈페이지" />
<meta property="og:description" content="요청하신 조건으로 산출한 견적서입니다. 링크를 열면 항목별 금액과 일정을 확인하실 수 있습니다." />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="company-info.js"></script>
<!-- 엑셀 견적서 다운로드 기능용 (되돌리려면 이 줄과 하단의 downloadEstimateExcelShared() 함수,
     #downloadExcelBtn 버튼만 삭제하면 됨) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: #F4F4F2;
  color: #0D0D0D;
  font-size: 14px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── TOP BAR ── */
.top-bar {
  position: sticky; top: 0; z-index: 200;
  background: #0A0A0A;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 32px; gap: 16px;
}
.top-bar-brand { color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
.top-bar-validity {
  font-size: 12px; color: rgba(255,255,255,.6);
  background: rgba(255,255,255,.07);
  padding: 5px 14px; border: 1px solid rgba(255,255,255,.12);
}
.top-bar-validity strong { color: #fff; }
.top-bar-btns { display: flex; gap: 10px; }
.btn-print {
  background: #CC001A; color: #fff; border: none;
  padding: 9px 22px; font-weight: 700; cursor: pointer;
  font-size: 13px; transition: background .2s; display: flex; align-items: center; gap: 6px;
}
.btn-print:hover { background: #8F0B20; }

/* ── HERO STRIP ── */
.hero-strip {
  position: relative; height: 260px; overflow: hidden;
  background: #111;
}
.hero-strip img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: .5; display: block;
}
.hero-strip-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
}
.hero-strip-label {
  font-size: 11px; font-weight: 700; letter-spacing: .18em;
  color: rgba(255,255,255,.6); margin-bottom: 10px;
}
.hero-strip-title {
  font-size: clamp(20px, 4vw, 36px);
  font-weight: 800; color: #fff; letter-spacing: -.03em;
  text-shadow: 0 2px 16px rgba(0,0,0,.4);
}
.hero-strip-sub {
  font-size: 13px; color: rgba(255,255,255,.7); margin-top: 8px;
}
/* 견적번호 (WB) — 인쇄물에도 남는다. 고객이 전화로 부르는 값이라 **읽기 쉬운 자간**을 준다. */
.hero-strip-qno {
  margin-top: 10px; display: inline-block;
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  color: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 3px 9px;
}

/* ── CONTENT WRAP ── */
.content-wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 100px; }

/* ── VALIDITY BANNER ── */
.validity-banner {
  background: #FEF0F2; border-left: 4px solid #CC001A;
  padding: 14px 20px; margin-bottom: 32px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.validity-banner svg { flex-shrink: 0; color: #CC001A; }
.validity-banner-text { font-size: 13px; color: #5A5A5A; line-height: 1.5; }
.validity-banner-text strong { color: #0D0D0D; }
.validity-expired { background: #FFF3F0; border-left-color: #FF4444; }
.validity-expired .validity-badge { background: #FF4444; }

/* ── QUOTE CARD ── */
.quote-card {
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,.07);
  margin-bottom: 28px;
  padding: 48px 56px;
}
.quote-hd {
  display: flex; justify-content: space-between; align-items: flex-start;
  border-bottom: 3px solid #111; padding-bottom: 20px; margin-bottom: 28px;
}
.brand-name { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.brand-sub { font-size: 11px; color: #6E6E6E; margin-top: 3px; }
.meta-blk { text-align: right; font-size: 12px; color: #5A5A5A; line-height: 1.8; }
.meta-blk .issue { font-size: 14px; font-weight: 700; color: #0D0D0D; }

.sec-title {
  font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: #6E6E6E; border-bottom: 1px solid #F0F0F0;
  padding-bottom: 6px; margin-bottom: 10px; margin-top: 24px;
}
/* ── 정보 박스 (수신처 정보 / 연수 계획) ──
   기존엔 얇은 줄로만 구분되는 표 형태라 밋밋해 보였음 — 각 항목을 독립된
   박스 카드로 분리해 크고 또렷하게 보이도록 재구성. */
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 14px 0 6px; }
.field-box { background: #FAFAFA; border: 1px solid #EFEFEF; border-left: 4px solid #CC001A; padding: 18px 22px; }
.field-box-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6E6E6E; margin-bottom: 8px; }
.field-box-value { font-size: 16.5px; font-weight: 700; color: #0D0D0D; line-height: 1.4; word-break: keep-all; }

/* ── 요청사항 박스: 자유 서술형이라 더 길고 넉넉하게 ── */
.req-box {
  font-size: 14.5px; color: #333; line-height: 2;
  padding: 26px 28px; margin: 4px 0 8px; min-height: 84px;
  background: #FAFAFA; border: 1px solid #EFEFEF; border-left: 4px solid #CC001A;
}

/* ── PRICE TABLE ── */
.price-tbl { width: 100%; border-collapse: collapse; margin: 14px 0; }
.price-tbl th {
  background: #111; color: #fff; padding: 11px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-align: left;
}
.price-tbl th:last-child { text-align: right; }
.price-tbl td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #F0F0F0; }
.price-tbl td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.price-tbl tr:last-child td { border-bottom: none; }

.totals-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
.t-card { padding: 18px 22px; background: #F4F4F4; border-left: 4px solid #111; }
.t-card.per { background: #FEF0F2; border-left-color: #CC001A; }
.t-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6E6E6E; margin-bottom: 6px; }
.t-amount { font-size: 22px; font-weight: 800; color: #0D0D0D; letter-spacing: -.02em; }
.t-card.per .t-amount { color: #CC001A; }
.t-note { font-size: 11px; color: #6E6E6E; margin-top: 3px; }

.inc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.inc-tag {
  background: #FEF0F2; color: #111; padding: 4px 12px;
  border-radius: 0; font-size: 12px; font-weight: 600;
}

/* ── ITINERARY ── */
.iti-card {
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,.07);
  margin-bottom: 28px;
}
.iti-header {
  background: linear-gradient(135deg, #111, #1E1E1E);
  border-left: 4px solid #CC001A;
  padding: 24px 32px;
}
.iti-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.45); margin-bottom: 6px; }
.iti-selected-badge {
  display: inline-block; margin-left: 8px; padding: 2px 8px;
  background: #CC001A; color: #fff; border-radius: 2px;
  font-size: 9px; font-weight: 800; letter-spacing: .08em;
}
.iti-card-selected { box-shadow: 0 0 0 2px #CC001A, 0 4px 24px rgba(204,0,26,.15); }
.iti-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.iti-sub { font-size: 13px; color: rgba(255,255,255,.6); }
.iti-highlights { padding: 24px 32px; display: flex; flex-wrap: wrap; gap: 8px; }
.iti-hl {
  background: #F4F4F2; border: 1px solid #E5E2DC;
  padding: 6px 14px; font-size: 12px; font-weight: 600; color: #0D0D0D;
}
.photo-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 180px; overflow: hidden; }
.photo-strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-strip.single { grid-template-columns: 1fr; }

/* ── DAY TIMELINE (탭형) ──
   여러 날짜를 아래로 길게 나열하는 대신, 하루씩 탭으로 전환해서 보도록 구성.
   처음 보는 사람도 바로 알아보도록 안내 문구 + 뚜렷한 활성/비활성 대비를 준다. */
.day-tabs-wrap { padding: 8px 32px 28px; }
.day-tabs-hint {
  font-size: 12px; font-weight: 600; color: #8F0B20; background: #FEF0F2;
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; margin-bottom: 12px;
}
.day-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}
.day-tab {
  flex: 0 0 auto; padding: 11px 20px; font-size: 13px; font-weight: 700;
  background: #fff; color: #5A5A5A; border: 1.5px solid #D8D5CE;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  cursor: pointer; white-space: nowrap; transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.day-tab:hover { border-color: #CC001A; color: #CC001A; }
.day-tab.active { background: #CC001A; color: #fff; border-color: #CC001A; box-shadow: 0 2px 8px rgba(204,0,26,.3); }
.day-panel { display: none; background: #F8F7F5; border-left: 3px solid #CC001A; padding: 18px 20px; }
.day-panel.active { display: block; }
.day-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.day-num { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #CC001A; flex-shrink: 0; }
.day-title { font-size: 15px; font-weight: 700; color: #0D0D0D; }
.day-sched { display: grid; grid-template-columns: 44px 1fr; gap: 6px 10px; font-size: 13px; color: #333; }
.sched-t { font-weight: 700; color: #6E6E6E; font-size: 11px; }
.day-tip { margin-top: 12px; padding: 9px 12px; background: #FEF0F2; font-size: 12px; color: #8F0B20; }

/* ── CTA SECTION ── */
.cta-section {
  background: #0A0A0A;
  padding: 44px 48px;
  margin-bottom: 28px;
  text-align: center;
}
.cta-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.4); margin-bottom: 12px; }
.cta-headline { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; letter-spacing: -.02em; }
.cta-sub { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 28px; }
.cta-btns {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
.cta-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 22px 16px; font-weight: 700; font-size: 14px;
  cursor: pointer; transition: all .2s;
  text-decoration: none; text-align: center; height: 100%;
}
.cta-btn-primary { background: #CC001A; color: #fff; border: none; }
.cta-btn-primary:hover { background: #8F0B20; }
.cta-btn-secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.3); }
.cta-btn-secondary:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.6); }
/* 카카오톡 공식 브랜드 컬러(#FEE500) — 다른 버튼과 구분되는 유일한 예외 색상 */
.cta-btn-kakao { background: #FEE500; color: #391B1B; border: none; }
.cta-btn-kakao:hover { background: #F5D800; }

/* ── FOOTER ── */
.view-footer {
  background: #0A0A0A; border-top: 2px solid #CC001A;
  padding: 28px 32px; text-align: center;
}
.view-footer p { font-size: 12px; color: rgba(255,255,255,.4); line-height: 1.8; }
.view-footer strong { color: rgba(255,255,255,.7); }

/* ── ERROR STATE ── */
.error-wrap {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh; text-align: center; padding: 40px;
}
.error-wrap h2 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
.error-wrap p { font-size: 14px; color: #5A5A5A; }

/* ── PRINT CSS ── */
@media print {
  /* 🔴 예전엔 `.validity-banner`도 여기서 숨겼다 (WQ). 그래서 **인쇄한 견적서에
     유효기간이 한 줄도 없었다** — 결재 서류로 올라가는 그 문서에서. 견적번호를
     인쇄물에 남기려고 히어로로 옮긴 것(WB)과 같은 이유로, 이건 UI 장식이 아니라 **조건**이다.
   ⚠ 다만 「N일 남음」은 인쇄하지 않는다 — 종이는 나중에 읽히고, 그때 그 숫자는 틀린 말이 된다. */
  .no-print, .top-bar, .cta-section, .view-footer { display: none !important; }
  .validity-banner { box-shadow: none; margin-bottom: 18px; }
  body { background: #fff; font-size: 12px; }
  .content-wrap { padding: 0; max-width: 100%; }
  .quote-card, .iti-card { box-shadow: none; page-break-inside: avoid; }
  .hero-strip { height: 140px; }
  .iti-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .price-tbl th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .t-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .top-bar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .top-bar-validity { display: none; }
  .quote-card { padding: 28px 20px; }
  .cta-section { padding: 32px 20px; }
  .quote-hd { flex-direction: column; gap: 16px; }
  .meta-blk { text-align: left; }
  .totals-row { grid-template-columns: 1fr; }
  .iti-header { padding: 20px 24px; }
  .iti-highlights { padding: 20px 24px; }
  .photo-strip { height: 120px; }
  .cta-btns { max-width: 100%; gap: 10px; }
  .cta-btn { padding: 18px 10px; font-size: 12.5px; gap: 6px; }
  .day-tabs-wrap { padding: 8px 20px 22px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar no-print">
  <a href="index.html" class="top-bar-brand" style="text-decoration:none;color:inherit;cursor:pointer">비즈페이지 · 해외연수 전문</a>
  <div class="top-bar-validity" id="validity-bar">유효기간 확인 중…</div>
  <div class="top-bar-btns">
    <button class="btn-print" onclick="window.print()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      인쇄 / PDF
    </button>
    <!-- 엑셀 다운로드 (신규 — 되돌리려면 이 버튼과 downloadEstimateExcelShared() 함수만 삭제) -->
    <button class="btn-print" id="downloadExcelBtn" onclick="downloadEstimateExcelShared()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      엑셀
    </button>
  </div>
</header>

<!-- HERO STRIP -->
<div class="hero-strip" id="hero-strip">
  <img id="hero-img" src="" alt="" onerror="this.style.display='none'">
  <div class="hero-strip-overlay">
    <div class="hero-strip-label" id="hero-label">OVERSEAS TRAINING PROGRAM</div>
    <div class="hero-strip-title" id="hero-title">해외연수 견적서</div>
    <div class="hero-strip-sub" id="hero-sub"></div>
    <!-- 견적번호 (WB) — ⚠ **인쇄물에 나와야 한다.** 상단 바는 `no-print`라 인쇄하면
         사라진다. 고객이 전화로 부를 수 있는 유일한 값이고, 결재 서류에 남는 것도 이것이다. -->
    <div class="hero-strip-qno" id="quote-no"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="content-wrap" id="main-content">
  <!-- 오류 상태 기본 표시 (JS로 교체됨) -->
  <div class="error-wrap" id="error-wrap">
    <h2>견적서를 불러오는 중…</h2>
    <p>잠시만 기다려 주세요.</p>
  </div>
</main>

<!-- FOOTER -->
<footer class="view-footer">
  <p>
    <a href="index.html" style="color:inherit;font-weight:700;text-decoration:none;cursor:pointer">비즈페이지</a> · 해외연수 전문 기업<br>
    <span id="footer-terms">본 견적서는 발급일로부터 30일간 유효합니다. 견적 내용은 환율·항공권 시세에 따라 변동될 수 있습니다.</span><br>
    <span id="footer-contact">문의: 비즈페이지 고객센터</span>
  </p>
</footer>

<script>
/* ════════════════════════════════════════
   estimate-view.html 렌더링 스크립트
   URL ?d= 파라미터에서 견적 데이터를 디코딩 후 렌더링
   ════════════════════════════════════════ */

const fmt = n => '₩ ' + (Number(n) || 0).toLocaleString('ko-KR');

/* 코스 A/B 각각의 일자 탭 전환 — courseKey('a'/'b')로 서로 다른 코스의 탭이
   섞이지 않게 구분한다. renderPage()가 innerHTML로 주입하는 onclick에서 호출되므로
   전역 함수여야 한다. */
function switchDayTab(courseKey, day) {
  document.querySelectorAll('.day-tab[data-course="' + courseKey + '"]').forEach(function (btn) {
    btn.classList.toggle('active', Number(btn.dataset.day) === Number(day));
  });
  document.querySelectorAll('.day-panel[data-course="' + courseKey + '"]').forEach(function (panel) {
    panel.classList.toggle('active', Number(panel.dataset.day) === Number(day));
  });
}

/* 엑셀 다운로드에서 쓸 견적 데이터 보관 (신규 — 되돌리려면 이 변수와
   downloadEstimateExcelShared() 함수만 삭제하면 됨) */
let _quoteData = null;

/* URL의 ?d= 파라미터는 클라이언트에서 임의로 조작해 만들 수 있으므로(서버 검증 없음),
   HTML로 삽입되는 모든 값은 반드시 이스케이프해야 XSS를 막을 수 있다.
   (기관명/담당자/요청사항 등 자유 입력 필드뿐 아니라, 링크를 직접 조작하면
   목적지명 등 다른 필드도 임의 문자열이 될 수 있어 예외 없이 전부 처리) */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ?d= base64 경로 제거 (2026-07-29).
   예전엔 견적 내용을 통째로 URL에 담아 이 페이지가 그대로 렌더했다. 서버를 전혀
   거치지 않으므로 **누구든 우리 도메인에 임의 금액의 견적서를 만들 수 있었고**,
   발급 기록이 없어 "이 링크 우리가 발급한 게 맞나"를 확인할 방법조차 없었다.
   가격 분쟁에서 우리 도메인이 상대 주장의 근거가 되는 구조였다.

   이제 견적서는 서버가 검증을 통과시킨 뒤 발급한 ?id= 링크로만 열린다. 내용은
   DB에만 존재한다. ⚠ 이 함수를 되살리면 위조 경로가 그대로 다시 열린다.

   구버전 ?d= 링크를 받은 고객이 있을 수 있어, 빈 화면 대신 안내를 띄운다. */
function legacyLinkUsed() {
  return new URLSearchParams(window.location.search).has('d');
}

async function loadShareData() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return null;
  try {
    const res = await fetch('/api/quote-shares/' + encodeURIComponent(id));
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

/* 🔴 발행일이 없으면 **만료 판정이 조용히 무력해진다**(WB).
   `new Date(undefined)` → Invalid Date → `daysLeft`가 NaN → `expired: NaN < 0` = **false**.
   실측: 패키지 발급 경로가 `iso`를 안 넣어서, 만료된 견적서가 만료가 아닌 것으로
   보이고 있었다. 지금은 세 발급 경로가 전부 `iso`를 넣지만(서버가 채운다), 옛 링크와
   앞으로 생길 경로를 위해 **여기서도 막는다** — 모르면 「모른다」고 말한다. */
function calcValidity(isoDate, pkgValidUntil) {
  /* 🔴 **패키지는 공급사가 정한 유효기간이 진실이다** (WP).
     우리의 「발급 후 30일」은 맞춤 견적 규칙이다. 패키지에 그대로 적용했더니
     **한 문서에 유효기간이 두 개** 찍혔다(실측: 상단 바 9/25까지 · 금액 기준 박스
     9/30까지). 고객은 어느 쪽을 믿어야 할지 알 수 없고, 더 나쁜 경우는 상품이 먼저
     마감되는 때다 — **마감된 상품을 「아직 유효」라고 말하게 된다**(패키지 방침 3번이
     막으려던 바로 그것). 그래서 그 날짜가 있으면 그것이 이긴다. */
  if (pkgValidUntil) {
    const until = new Date(pkgValidUntil);
    if (!isNaN(until.getTime())) {
      /* ⚠ 「9월 30일까지」는 **그날 하루를 포함한다.** 자정으로 재면 그날 아침에
         이미 만료로 뜬다 — 사람이 읽는 「까지」와 어긋난다. */
      until.setHours(23, 59, 59, 999);
      const daysLeft = Math.ceil((until - new Date()) / 86400000);
      return { expires: until, daysLeft, expired: daysLeft < 0, fromPackage: true };
    }
  }
  const issued = new Date(isoDate);
  if (isNaN(issued.getTime())) return { expires: null, daysLeft: null, expired: false, unknown: true };
  const expires = new Date(issued);
  expires.setDate(expires.getDate() + 30);
  /* ⚠ 위와 같은 이유로 마지막 날을 포함한다 — 「30일간 유효」의 30일째가 살아 있어야 한다 */
  expires.setHours(23, 59, 59, 999);
  const now = new Date();
  const daysLeft = Math.ceil((expires - now) / 86400000);
  return { expires, daysLeft, expired: daysLeft < 0 };
}

function renderPage(d) {
  /* 탭 제목·인쇄물 머리글·즐겨찾기 이름이 되는 자리. **여기 한 곳뿐이다** —
     WO에서 아래(히어로 제목 옆)에 한 줄 더 썼다가 지웠다. 같은 값을 두 곳에서
     정하면 반드시 어긋난다(결함 생성기 ①). 히어로와 같은 규칙으로 갈린다.
     ⚠ 고객사명·금액은 넣지 않는다 — 탭 제목은 화면 공유·스크린샷에 그대로 남는다. */
  document.title = `${d.dt} ${d.pkg ? '여행' : '연수'} 견적서 · 비즈페이지`;

  /* ── 히어로 ── */
  if (d.cover) {
    document.getElementById('hero-img').src = d.cover;
    document.getElementById('hero-img').alt = d.dt;
  } else {
    document.getElementById('hero-strip').style.background = 'linear-gradient(135deg,#111,#1E1E1E)';
  }
  /* ⚠ 예전엔 무조건 「○○ 연수 견적서」였다(WB). 가족·친목 손님이 받는 문서에도 그랬다 —
     패키지·휴양 견적서가 「오키나와 연수 견적서」로 나갔다. 연수인 것만 연수라 부른다. */
  document.getElementById('hero-title').textContent = d.dt + (d.pkg ? ' 여행 견적서' : ' 연수 견적서');
  /* 라벨도 같이 갈린다 — 패키지 여행 문서에 「TRAINING PROGRAM」이 박혀 있었다(WP) */
  document.getElementById('hero-label').textContent = d.pkg ? 'TRAVEL PACKAGE' : 'OVERSEAS TRAINING PROGRAM';
  /* 푸터의 「발급일로부터 30일간 유효」도 맞춤 견적 규칙이다 — 패키지는 다르다 */
  const footTerms = document.getElementById('footer-terms');
  if (footTerms && d.pkg) {
    footTerms.textContent = d.pkg.validUntil
      ? '본 견적서의 유효기간은 위에 적힌 상품 유효기간을 따릅니다. 출발일·좌석 상황에 따라 조기 마감될 수 있습니다.'
      : '본 견적서의 유효기간은 담당자에게 확인해 주세요. 출발일·좌석 상황에 따라 조기 마감될 수 있습니다.';
  }
  document.getElementById('hero-sub').textContent = d.ptx + ' · ' + d.n + '명 · ' + (d.ng ? d.ng + '박 ' : '') + d.d + '일';

  /* ── 유효기간 ── */
  const validity = calcValidity(
    d.iso || (d.id || '').replace(/[년 월일]/g, m => m === '년' ? '-' : m === '월' ? '-' : ''),
    d.pkg && d.pkg.validUntil);
  const expiresStr = validity.expires
    ? validity.expires.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : null;
  const validityBar = document.getElementById('validity-bar');
  if (validity.unknown) {
    /* ⚠ 모르면 「모른다」고 쓴다. 예전엔 이 경우가 **「만료 아님」으로 조용히 통과**했다 */
    validityBar.innerHTML = '유효기간은 담당자에게 확인해 주세요';
  } else if (validity.expired) {
    validityBar.innerHTML = `<span style="color:#FF6B6B">유효기간 만료 (${expiresStr})</span>`;
  } else {
    validityBar.innerHTML = `유효기간 &nbsp;<strong>${expiresStr}까지</strong> &nbsp;(${validity.daysLeft}일 남음)`;
  }

      <td>${fmt(amount)}</td>
    </tr>`).join('');

  /* ── 포함 태그 ── */
  const incTags = (d.rows || []).map(([name]) => `<span class="inc-tag">${esc(name)}</span>`).join('');

  /* ── 코스 A/B 하이라이트 + 일자별 상세 일정 ──
     일자별 내용을 아래로 길게 쌓지 않고, 하루씩 탭으로 전환해서 보여준다
     (courseKey로 코스 A/B 탭을 서로 구분 — id 충돌 방지). */
  function renderCourse(iti, label, isSelected, courseKey) {
    if (!iti) return '';
    const hls = (iti.h || []).map(h => `<span class="iti-hl">· ${esc(h)}</span>`).join('');

    /* day.day는 공유 payload(/api/quote-shares POST, 인증 불필요)에서 온 값이라
       신뢰할 수 없다. 아래 두 자리는 이스케이프가 안 걸려 있어서, 문자열이 들어오면
       인라인 핸들러 switchDayTab('a', ...)를 탈출한다. 로그인한 담당자가 고객 공유
       링크를 열어보는 건 일상적인 동작이라("이 견적서 확인해 주세요") 그 세션에서
       코드가 도는 경로가 된다. 일차는 원래 숫자이므로 숫자로 못 박는다. */
    const dayNo = (day) => Number(day && day.day) || 0;
    const tabs = dayList.map((day, i) => `

    return `

        <div class="iti-title">${esc(iti.t)}</div>
        <div class="iti-sub">${esc(iti.s)}</div>
      </div>
      <div class="iti-highlights">${hls}</div>
      ${dayList.length ? `
      <div class="day-tabs-wrap">
        <div class="day-tabs-hint">👆 아래 일자를 눌러 하루 일정을 확인하세요</div>
        <div class="day-tabs" role="tablist">${tabs}</div>
        <div class="day-panels">${panels}</div>
      </div>` : ''}
    </div>`;
  }

  /* ── 사진 스트립 ── */
  const strip = d.strip || [];
  const photoStripHtml = strip.length >= 2 ? `
    <div class="photo-strip no-print" style="margin-bottom:28px">
      <img src="${esc(strip[0])}" alt="${esc(d.dt)}" loading="lazy" onerror="this.parentElement.style.display='none'">
      <img src="${esc(strip[1])}" alt="${esc(d.dt)}" loading="lazy" onerror="this.parentElement.style.display='none'">
    </div>` : strip.length === 1 ? `
    <div class="photo-strip single no-print" style="margin-bottom:28px">
      <img src="${esc(strip[0])}" alt="${esc(d.dt)}" loading="lazy" onerror="this.parentElement.style.display='none'">
    </div>` : '';

  /* ── 유효기간 배너 ── */
  const validityBanner = validity.expired
    ? `<div class="validity-banner validity-expired">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="validity-banner-text">
          이 견적서는 <strong>유효기간이 만료</strong>되었습니다 (만료일: ${expiresStr}).<br>
          최신 견적은 비즈페이지 고객센터로 문의 부탁드립니다.
        </div>
      </div>`
    : `<div class="validity-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        ${/* 🔴 발급일 자리에 `d.id`를 찍고 있었다 (WP). 이 칸은 **경로마다 뜻이 다르다**:
               · 고객 계산기 → 「2026년 8월 26일」(한글 날짜)
               · 담당자 발급 → **견적 기록 id**(`mfa3k2x` 같은 값)
             그래서 담당자가 낸 견적서를 받은 고객은
             「견적 유효기간: **mfa3k2x** 발급 → …」을 읽고 있었다.
             한 칸에 두 뜻을 담은 자리다 — **발급일의 진실은 `iso`**(세 경로가 모두 넣는다).
           ⚠ 패키지는 유효기간이 상품 것이라 「발급 →」이라는 말 자체가 안 맞는다. */''}
        <div class="validity-banner-text">
          ${validity.fromPackage
            ? `상품 유효기간: <strong>${expiresStr}까지</strong>`
            : `견적 유효기간: ${d.iso ? `<strong>${esc(fmtDate(d.iso))}</strong> 발급 &nbsp;→&nbsp; ` : ''}<strong>${expiresStr}까지</strong>`}
          <span class="no-print">&nbsp;(<strong>${validity.daysLeft}일</strong> 남음)</span>
        </div>
      </div>`;

  /* ── 특이사항 ── */
  const reqHtml = d.req ? `
    <div class="sec-title">특이사항 / 요청사항</div>
    <div class="req-box">${esc(d.req).replace(/\n/g, '<br>')}</div>` : '';

  /* ── 전체 HTML ── */
  document.getElementById('main-content').innerHTML = `
    ${validityBanner}

    <!-- 견적서 본문 -->
    <div class="quote-card">
      <div class="quote-hd">
        <div>
          <div class="brand-name"><a href="index.html" style="color:inherit;text-decoration:none;cursor:pointer">비즈페이지</a></div>
          <div class="brand-sub">해외연수 전문 기업 · 견적서</div>
        </div>
        <div class="meta-blk">
          ${/* 🔴 여기도 `d.id`였다 (WP) — 문서 머리의 **발행일 자리**다.
                 담당자가 낸 견적서에서는 그 칸에 견적 기록 id(`mfa3k2x`)가 찍혔다.
                 발행일의 진실은 `iso`다(세 발급 경로가 모두 넣는다).
               ⚠ 옛 링크는 `id`에 한글 날짜(「2026년 8월 26일」)가 들어 있다 —
                 **날짜처럼 생겼을 때만** 그것으로 물러난다. 아무 값이나 받으면
                 지금 고치는 이 결함이 그대로 되살아난다. */''}
          <div class="issue">${esc(d.iso ? fmtDate(d.iso) : (/[0-9]{4}[.\-년]/.test(String(d.id || '')) ? d.id : ''))}</div>
          ${/* ⚠ 「요율 기준」은 **맞춤 견적에만 있는 개념**이다(우리 요율표 버전).
                 패키지는 요율을 안 타므로 이 줄이 늘 「—」로 남는다 — 없는 칸에 줄표를

          ${d.pkg ? '' : `<div>발급번호 · ${esc(d.rv) || '—'}</div>

        <div class="field-box"><div class="field-box-label">기관명</div><div class="field-box-value">${esc(d.org) || '—'}</div></div>
        <div class="field-box"><div class="field-box-label">담당자</div><div class="field-box-value">${esc(d.cn) || '—'}</div></div>

/* 엑셀 견적서 다운로드 (신규 — 되돌리려면 이 함수와 위 _quoteData 변수,
   #downloadExcelBtn 버튼, SheetJS <script> 태그만 삭제하면 완전히 원상복귀됨) */
function downloadEstimateExcelShared() {
  if (typeof XLSX === 'undefined') {
    alert('엑셀 다운로드 기능을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
    return;
  }
  const d = _quoteData;
  if (!d) return;

  const CI = window.COMPANY_INFO || {};
  const legalName = CI.legalName || '(주)하나이엔비티';

  /* 🔴 이 파일은 **고객이 결재에 붙이는 문서**다. 화면에는 있는데 여기 없으면,
     받는 쪽은 그 조건을 못 보고 결재한다. WQ에서 세 가지를 더했다:
       · 유효기간 — 견적서의 핵심 조건인데 통째로 빠져 있었다
       · 상품명   — 패키지인데 「방콕」만 있고 **어떤 상품인지가 없었다**
       · 포함/불포함 — 금액이 무엇을 담고 있는지를 정하는 목록이다
     ⚠ 없는 칸은 **줄 자체를 안 만든다**(화면과 같은 규칙 — WP).
       엑셀에 「기관 유형 · —」이 남으면 받는 쪽은 우리가 빠뜨린 줄 안다. */
  const validUntilStr = (d.pkg && d.pkg.validUntil)
    ? d.pkg.validUntil
    : (d.iso ? new Date(new Date(d.iso).getTime() + 30 * 86400000).toISOString().slice(0, 10) : '');

  const aoa = [
    [legalName + ' 견적서'],
    /* 🔴 여기가 `d.id`였다(WB). 「발행일」이라고 적어 놓고 `mrx9l0xqhudmf1` 같은
       **랜덤 식별자**를 찍고 있었다 — 고객이 받는 엑셀에 그대로 나갔다.
       발행일 데이터는 처음부터 `d.iso`에 있었는데 엉뚱한 칸을 읽었을 뿐이다.
       ⚠ WP에서 **화면 두 곳에도 같은 결함이 남아 있던 것**을 찾았다 — 한 곳을 고칠 때
         같은 값을 읽는 다른 곳을 함께 세지 않으면 이렇게 남는다. */
    ['견적번호', d.qno || '—'],
    ['발행일', d.iso || '—'],
    ...(validUntilStr ? [[(d.pkg ? '상품 유효기간' : '견적 유효기간'), validUntilStr + '까지']] : []),
    ...(d.pkg && d.pkg.title ? [['상품명', d.pkg.title]] : []),
    ['목적지', d.dt || '—'],
    [(d.pkg ? '상품 구분' : '프로그램'), d.ptx || '—'],
    ...(d.pkg ? [] : [['기관 유형', d.ot || '—']]),
    [(d.pkg ? '인원' : '참가 인원'), (d.n || 0) + '명'],
    [(d.pkg ? '여행 기간' : '연수 기간'), (d.d || 0) + '일'],
    ['신청 기관', d.org || '—'],
    ['담당자', d.cn || '—'],
    [],
    ['항목', '금액(원)'],
    ...(d.rows || []),
    [],
    ['합계', d.t || 0],
    ['1인당 금액', d.pp || 0],
    ...((d.pkg && (d.pkg.included || []).length) ? [[], ['포함 사항'], ...d.pkg.included.map((x) => [x])] : []),
    ...((d.pkg && (d.pkg.excluded || []).length) ? [[], ['불포함 사항'], ...d.pkg.excluded.map((x) => [x])] : []),
  ];

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 28 }, { wch: 18 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '견적서');

  const fileDate = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `비즈페이지_견적서_${d.dt || ''}_${fileDate}.xlsx`);
}
</script>
</body>
</html>
