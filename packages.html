<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패키지 여행 · 비즈페이지</title>
<meta name="description" content="소규모 단체·친목 모임을 위한 패키지 여행. 일정과 금액을 견적서로 정리해 드립니다." />
<!-- 공유 미리보기 (WN) — 이 화면은 카톡으로 「이거 어때요」 하고 보내는 자리다 -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="비즈페이지" />
<meta property="og:title" content="패키지 여행 · 비즈페이지" />
<meta property="og:description" content="소규모 단체·친목 모임을 위한 패키지 여행. 일정과 금액을 견적서로 정리해 드립니다." />
<meta property="og:url" content="https://bizpage-estimate.vercel.app/packages.html" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- 디자인 토큰·기본 타이포를 본 사이트와 공유한다. 별도 스타일을 새로 쓰면
     두 화면의 색·간격이 조용히 갈라진다(같은 회사인데 다른 사이트처럼 보인다). -->
<link rel="stylesheet" href="styles.css">
<script src="company-info.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════
   패키지 여행 — 고객 입구 (VP)

   ⚠ **입구는 나누되 백엔드는 하나다.** 이 화면은 견적 엔진을 타지 않는다 —
     가격은 `packages` 테이블의 값을 **그대로** 보여준다(대리점가).
     여기서 요율·계수·마진을 얹으면 원본보다 비싸진다(실측 +21.5%·+41.7%).

   ⚠ 이 파일은 `styles.css`의 토큰만 빌려 쓰고, 화면 규칙은 여기서 끝낸다.
     `styles.css`를 고치면 본 사이트가 함께 움직이므로 **여기서는 안 고친다.**
   ══════════════════════════════════════════════════════════════════ */
.pk-wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--pad-x, 24px); }

/* ── 머리줄 ── 본 사이트로 돌아가는 길을 항상 남긴다 */
.pk-nav {
  position: sticky; top: 0; z-index: 40;
  background: var(--ink); color: var(--white);
  border-bottom: 1px solid var(--rule-inv);
}
.pk-nav-in { display: flex; align-items: center; gap: 20px; height: 62px; }
.pk-brand { font-weight: 800; font-size: 17px; letter-spacing: -.01em; color: var(--white); }
.pk-brand span { color: var(--red); }
.pk-nav-sep { flex: 1; }
.pk-nav a.pk-back {
  font-size: 13px; color: rgba(255,255,255,.72); border: 1px solid var(--rule-inv);
  padding: 8px 14px; border-radius: 999px; transition: .18s;
}
.pk-nav a.pk-back:hover { color: var(--white); border-color: rgba(255,255,255,.3); }

/* ── 히어로 ── 기업 연수와 **다른 화면**임을 첫 줄에서 말한다 */
.pk-hero { background: var(--bg-off); padding: 56px 0 44px; border-bottom: 1px solid var(--rule); }
.pk-eyebrow {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em;
  color: var(--red); margin-bottom: 12px;
}
.pk-hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; color: var(--t-head); }
.pk-hero p { margin-top: 12px; font-size: 15px; color: var(--t-mute); max-width: 640px; line-height: 1.8; }
.pk-hero .pk-xlink { margin-top: 20px; font-size: 13px; color: var(--t-sub); }
.pk-hero .pk-xlink a { color: var(--t-head); font-weight: 700; border-bottom: 1px solid var(--rule-md); }

/* ── 거르개 ── */
.pk-filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 24px 0 4px; }
.pk-chip {
  font-size: 13px; padding: 8px 15px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule-md); background: var(--white); color: var(--t-mute); transition: .16s;
}
.pk-chip:hover { border-color: var(--ink); color: var(--t-head); }
.pk-chip.on { background: var(--ink); border-color: var(--ink); color: var(--white); font-weight: 700; }

/* ── 목록 ── */
.pk-count { padding: 18px 0 10px; font-size: 13px; color: var(--t-sub); }
.pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding-bottom: 64px; }
.pk-card {
  border: 1px solid var(--rule); border-radius: 14px; background: var(--white);
  padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: .18s;
}
.pk-card:hover { border-color: var(--rule-md); transform: translateY(-2px); }
/* 사진 (VZ) — 카드 위쪽을 꽉 채운다. 카드에 padding이 있어 음수 margin으로 끌어낸다.
   ⚠ 세로 비율을 고정한다(16:10). 안 그러면 사진이 늦게 오면서 카드 높이가 튀어
     목록 전체가 한 번 출렁인다 — 고객이 누르려던 카드가 그 순간 움직인다. */
.pk-thumb {
  margin: -20px -20px 0; border-radius: 14px 14px 0 0; overflow: hidden;
  aspect-ratio: 16 / 10; background: var(--bg-off);
}
.pk-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pk-card-top { display: flex; align-items: center; gap: 8px; }
.pk-dest { font-size: 12px; font-weight: 700; color: var(--red); letter-spacing: .04em; }
.pk-dur { font-size: 12px; color: var(--t-sub); }
.pk-title { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--t-head); }
.pk-meta { font-size: 13px; color: var(--t-mute); line-height: 1.7; }
.pk-price-row { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule); }
.pk-price { font-size: 22px; font-weight: 800; color: var(--t-head); letter-spacing: -.02em; }
.pk-price small { font-size: 12px; font-weight: 500; color: var(--t-sub); margin-left: 4px; }

/* ⚠ **가격이 언제 값인지를 카드마다 찍는다.** 패키지가는 자주 바뀌고 우리는
   대리점이라 그 값으로 팔아야 한다 — 조회 시점 없이 보여주면 낡은 값인지 아무도 모른다. */
.pk-asof { margin-top: 6px; font-size: 11px; color: var(--t-sub); }
.pk-asof.stale { color: var(--red); font-weight: 700; }

.pk-cta {
  margin-top: 14px; width: 100%; padding: 12px 0; border: 0; border-radius: 10px;
  background: var(--red); color: var(--white); font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: .16s;
}
.pk-cta:hover { background: var(--red-dk); }

/* ── 빈 상태 ── **비어 있는 이유를 말한다.** 그냥 비면 고장으로 읽힌다 */
.pk-empty { padding: 56px 20px; text-align: center; color: var(--t-sub); font-size: 14px; line-height: 1.9; }
.pk-empty b { color: var(--t-head); }

/* ── 상세 ── */
.pk-modal { position: fixed; inset: 0; z-index: 90; display: none; }
.pk-modal.on { display: block; }
.pk-modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.pk-modal-box {
  position: relative; max-width: 780px; margin: 5vh auto; max-height: 90vh; overflow: auto;
  background: var(--white); border-radius: 16px; padding: 30px;
}
.pk-modal-close {
  position: absolute; top: 16px; right: 18px; border: 0; background: none;
  font-size: 24px; cursor: pointer; color: var(--t-sub); line-height: 1;
}
.pk-day { border-left: 2px solid var(--rule-md); padding: 0 0 18px 16px; margin-left: 6px; position: relative; }
.pk-day::before {
  content: ''; position: absolute; left: -5px; top: 6px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--red);
}
.pk-day h4 { font-size: 13px; font-weight: 800; color: var(--red); margin-bottom: 6px; }
.pk-day p { font-size: 13px; color: var(--t-body); line-height: 1.8; }
.pk-ask { display: flex; align-items: center; gap: 8px; margin-top: 22px; font-size: 13px; color: var(--t-mute); }
.pk-ask input {
  width: 90px; padding: 9px 10px; border: 1px solid var(--rule-md); border-radius: 8px;
  font-family: inherit; font-size: 14px; color: var(--t-head);
}
/* 총액 미리보기 (XO 후속) — 인원을 넣는 즉시 「1인 금액 × 인원 = 총액」을 보여 준다.
   ⚠ 비어 있으면 자리를 차지하지 않는다(`:empty`) — 인원이 이상할 때 빈 상자가
     남으면 그것도 「뭔가 잘못됐나」로 읽힌다. */
.pk-total {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-top: 12px; padding: 12px 14px; background: var(--bg-soft, #FAFAF8);
  border: 1px solid var(--rule-md); border-radius: 8px;
  font-size: 13px; color: var(--t-mute);
}
.pk-total:empty { display: none; }
.pk-total strong { font-size: 20px; font-weight: 800; color: var(--t-head); letter-spacing: -.02em; }

/* 받으실 분·연락처 (WF) — 인원 칸과 달리 한 줄에 하나씩 세로로 쌓는다.
   ⚠ 안내(「견적서에는 표시되지 않습니다」)를 흐리게 쓰지 않는다 — 이 한 줄이
     연락처를 적게 만드는 유일한 이유라, 안 읽히면 칸이 비어서 온다. */
.pk-lead { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.pk-lead label { font-size: 13px; color: var(--t-mute); margin-top: 6px; }
.pk-lead label b { color: var(--red); font-weight: 800; }
.pk-lead label small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--t-sub); line-height: 1.6; }
.pk-lead input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--rule-md); border-radius: 8px;
  font-family: inherit; font-size: 14px; color: var(--t-head);
}
.pk-sec-h { font-size: 13px; font-weight: 800; color: var(--t-head); margin: 22px 0 10px; }
.pk-list { font-size: 13px; color: var(--t-body); line-height: 1.9; padding-left: 18px; }

@media (max-width: 720px) {
  .pk-hero h1 { font-size: 26px; }
  .pk-grid { grid-template-columns: 1fr; }
  .pk-modal-box { margin: 0; border-radius: 0; min-height: 100vh; padding: 24px 18px; }
}
</style>
</head>
<body>

<nav class="pk-nav">
  <div class="pk-wrap pk-nav-in">
    <a href="index.html" class="pk-brand">비즈<span>페이지</span></a>
    <div class="pk-nav-sep"></div>
    <a href="index.html" class="pk-back">기업·공공기관 맞춤 견적 →</a>
  </div>
</nav>

<header class="pk-hero">
  <div class="pk-wrap">
    <span class="pk-eyebrow">패키지 여행</span>
    <h1>정해진 일정, 정해진 금액.<br>견적서로 정리해 드립니다.</h1>
    <p>
      소규모 단체·친목 모임을 위한 패키지 상품입니다. 일정과 금액이 이미 확정된 상품이라
      기다리실 필요가 없습니다. 마음에 드는 상품을 고르시면 <b>일정표와 견적서</b>를 바로 만들어 드립니다.
    </p>
    <p class="pk-xlink">
      기업·공공기관 연수처럼 <b>인원·일정·목적에 맞춰 새로 짜야 하는</b> 여행이라면
      <a href="index.html">맞춤 견적</a>을 이용해 주세요.
    </p>
  </div>
</header>

<main class="pk-wrap">
  <div class="pk-filters" id="pkFilters"></div>
  <div class="pk-count" id="pkCount"></div>
  <div class="pk-grid" id="pkGrid"></div>
  <div class="pk-empty" id="pkEmpty" style="display:none"></div>
</main>

<div class="pk-modal" id="pkModal">
  <div class="pk-modal-bg" data-close="1"></div>
  <div class="pk-modal-box">
    <button class="pk-modal-close" data-close="1" aria-label="닫기">&times;</button>
    <div id="pkDetail"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   ⚠ 이 화면은 **견적 엔진을 부르지 않는다.** 서버가 준 가격을 그대로 쓴다.
     `script.js`(견적 엔진)를 여기서 싣지 않는 것이 그 방어선이다 —
     싣는 순간 누군가 계수를 얹고 싶어지고, 그러면 원본보다 비싸진다.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  var ALL = [];
  /* 목록을 **못 받은 것**인지 **없는 것**인지 (XX) — 화면이 하는 말이 갈린다 */
  var LOAD_FAILED = false;
  var destFilter = '';

  var won = function (n) { return n == null ? '—' : Number(n).toLocaleString('ko-KR'); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmtDate = function (d) {
    if (!d) return '';
    var t = new Date(d);
    if (isNaN(t.getTime())) return '';
    return t.getFullYear() + '.' + String(t.getMonth() + 1).padStart(2, '0') + '.' + String(t.getDate()).padStart(2, '0');
  };
  /* 가격을 확인한 지 며칠 지났나 — 오래됐으면 화면이 그렇게 말한다 */
  var daysSince = function (d) {
    var t = new Date(d);
    if (isNaN(t.getTime())) return null;
    return Math.floor((Date.now() - t.getTime()) / 86400000);
  };
  var STALE_DAYS = 7;

  /* 🔴 **고객이 낼 1인 금액은 서버가 정한다** (XO 후속).
     항목별로 조립한 상품은 서버(`perPersonOf`)가 **항목 합**을 쓰는데, 화면은
     `pricePerPerson`을 그리고 있었다 — 그러면 **목록에서 본 금액과 받은 견적서의
     금액이 다를 수 있다.** 어느 쪽이 이기는지는 서버가 아는 규칙이라 서버가 계산해
     보내 준다(`perPerson`). 화면은 그것을 쓰기만 한다.
   ⚠ 옛 응답(캐시)에는 그 칸이 없을 수 있어 `pricePerPerson`으로 떨어진다 — 그건
     지금까지와 같은 동작이라 나빠지지 않는다. */
  var perPersonOf = function (p) {
    return (p && p.perPerson != null) ? p.perPerson : (p && p.pricePerPerson);
  };

  function render() {
    var list = destFilter ? ALL.filter(function (p) { return (p.destLabel || p.destKey) === destFilter; }) : ALL;
    var grid = document.getElementById('pkGrid');
    var empty = document.getElementById('pkEmpty');
    var count = document.getElementById('pkCount');

    count.textContent = list.length ? ('상품 ' + list.length + '개') : '';
    if (!list.length) {
      grid.innerHTML = '';
      empty.style.display = '';
      /* ⚠ **비어 있는 이유를 말한다.** 그냥 비워 두면 고장으로 읽히고 문의가 안 온다.
         🔴 그리고 **「못 불러왔다」와 「없다」를 가른다**(XX) — 셋은 할 일이 전부 다르다:
           ① 우리가 목록을 못 받았다 → 다시 열어 보면 된다
           ② 고른 지역에만 없다 → 다른 지역을 보면 된다
           ③ 정말 파는 것이 없다 → 맞춤 견적으로 안내한다 */
      empty.innerHTML = LOAD_FAILED
        ? '<b>지금 상품 목록을 불러오지 못했습니다.</b><br>일시적인 오류입니다 — 잠시 후 다시 열어 주세요.'
          + ' <button type="button" onclick="location.reload()" style="margin-left:6px;background:#CC001A;color:#fff;border:none;padding:6px 14px;font-weight:700;cursor:pointer">다시 시도</button>'
        : (ALL.length
          ? '<b>고르신 지역에는 지금 열린 상품이 없습니다.</b><br>다른 지역을 보시거나, 원하시는 일정으로 <a href="index.html" style="border-bottom:1px solid #ccc">맞춤 견적</a>을 요청해 주세요.'
          : '<b>지금 준비된 패키지 상품이 없습니다.</b><br>원하시는 지역·일정을 알려 주시면 맞춰 드립니다 — <a href="index.html" style="border-bottom:1px solid #ccc">맞춤 견적 요청</a>');
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = list.map(function (p, i) {
      var age = daysSince(p.priceAsOf);
      var stale = age != null && age > STALE_DAYS;
      var dur = (p.nights && p.days) ? (p.nights + '박 ' + p.days + '일') : '';
      return '<article class="pk-card">'
        /* 사진 (VZ) — 공급사가 준 주소를 그대로 싣는다(우리가 호스팅하지 않는다).
           ⚠ **그쪽이 지우면 사진이 깨진다.** 그때 빈 상자를 남기면 상품이 고장 난 것처럼
             보이므로, onerror로 **자리째 접는다**. 안 접으면 회색 네모가 카드마다 남는다.
           ⚠ 주소는 서버가 https만 통과시킨다. 여기서도 esc()로 속성을 닫는다. */
        + (p.imageUrl
            ? '<div class="pk-thumb"><img src="' + esc(p.imageUrl) + '" alt="" loading="lazy"'
              + ' onerror="this.parentElement.remove()"></div>'
            : '')
        + '<div class="pk-card-top">'
        +   '<span class="pk-dest">' + esc(p.destLabel || p.destKey || '') + '</span>'
        +   (dur ? '<span class="pk-dur">· ' + esc(dur) + '</span>' : '')
        + '</div>'
        + '<h3 class="pk-title">' + esc(p.title) + '</h3>'
        + '<div class="pk-meta">'
        +   (p.departDate ? '출발 ' + esc(fmtDate(p.departDate)) : '출발일 협의')
        + '</div>'
        + '<div class="pk-price-row">'
        +   '<div class="pk-price">' + won(perPersonOf(p)) + '<small>원 / 1인</small></div>'
        +   '<div class="pk-asof' + (stale ? ' stale' : '') + '">'
        +     (age == null ? '' : (stale
              ? '⚠ ' + esc(fmtDate(p.priceAsOf)) + ' 기준 — 확인이 필요합니다'
              : esc(fmtDate(p.priceAsOf)) + ' 기준 금액'))
        +   '</div>'
        +   '<button class="pk-cta" data-i="' + i + '">일정 · 견적서 보기</button>'
        + '</div>'
        + '</article>';
    }).join('');

    /* ⚠ 인라인 onclick 안에 값을 끼워 넣지 않는다 — 그 구조는 esc()로 막을 수 없다
       (CLAUDE.md 결함 생성기 ④). 목록 위치(index)만 넘기고 값은 배열에서 꺼낸다. */
    Array.prototype.forEach.call(grid.querySelectorAll('.pk-cta'), function (b) {
      b.addEventListener('click', function () { openDetail(list[Number(b.dataset.i)]); });
    });
  }

  function renderFilters() {
    var seen = [];
    ALL.forEach(function (p) {
      var k = p.destLabel || p.destKey;
      if (k && seen.indexOf(k) < 0) seen.push(k);
    });
    var box = document.getElementById('pkFilters');
    if (!seen.length) { box.innerHTML = ''; return; }
    box.innerHTML = ['<button class="pk-chip on" data-d="">전체</button>']
      .concat(seen.map(function (d) { return '<button class="pk-chip" data-d="' + esc(d) + '">' + esc(d) + '</button>'; }))
      .join('');
    Array.prototype.forEach.call(box.querySelectorAll('.pk-chip'), function (c) {
      c.addEventListener('click', function () {
        destFilter = c.dataset.d || '';
        Array.prototype.forEach.call(box.querySelectorAll('.pk-chip'), function (x) { x.classList.remove('on'); });
        c.classList.add('on');
        render();
      });
    });
  }

  function openDetail(p) {
    if (!p) return;
    var days = Array.isArray(p.itinerary) ? p.itinerary : [];
    var listOf = function (v) { return Array.isArray(v) ? v : (v ? [String(v)] : []); };
    var incl = listOf(p.included), excl = listOf(p.excluded);

    document.getElementById('pkDetail').innerHTML =
        '<span class="pk-eyebrow">' + esc(p.destLabel || p.destKey || '패키지') + '</span>'
      + '<h2 style="font-size:22px;font-weight:800;line-height:1.4;margin-bottom:8px">' + esc(p.title) + '</h2>'
      + '<div class="pk-meta">'
      +   ((p.nights && p.days) ? esc(p.nights + '박 ' + p.days + '일') : '')
      +   (p.departDate ? ' · 출발 ' + esc(fmtDate(p.departDate)) : '')
      + '</div>'
      + '<div class="pk-price-row" style="margin-top:16px">'
      +   '<div class="pk-price">' + won(perPersonOf(p)) + '<small>원 / 1인</small></div>'
      +   '<div class="pk-asof">' + esc(fmtDate(p.priceAsOf)) + ' 기준 금액'
      +     (p.validUntil ? ' · ' + esc(fmtDate(p.validUntil)) + '까지 유효' : '') + '</div>'
      + '</div>'
      + (days.length
          ? '<div class="pk-sec-h">일정</div>' + days.map(function (d, i) {
              var body = [d.am, d.pm, d.eve].filter(Boolean).join(' / ') || d.title || '';
              return '<div class="pk-day"><h4>DAY ' + (i + 1) + (d.title ? ' · ' + esc(d.title) : '') + '</h4>'
                + '<p>' + esc(body) + '</p></div>';
            }).join('')
          : '')
      + (incl.length ? '<div class="pk-sec-h">포함 사항</div><ul class="pk-list">'
          + incl.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '')
      + (excl.length ? '<div class="pk-sec-h">불포함 사항</div><ul class="pk-list">'
          + excl.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '')
      + '<div class="pk-ask">'
      +   '<label for="pkPax">인원</label>'
      +   '<input type="number" id="pkPax" min="1" max="500" value="4">'
      +   '<span>명</span>'
      + '</div>'
      /* 🔴 **총액을 누르기 전에 보여 준다** (XO 후속). 예전에는 1인 금액만 보이고,
         인원을 넣어도 화면에 아무 변화가 없었다 — 고객은 **견적서를 받고 나서야**
         자기가 낼 총액을 처음 본다. 그 자리가 곧 「생각보다 비싼데?」로 이탈하는
         자리다. 서버가 하는 계산과 **같은 곱셈**을 그대로 보여 준다(1인 금액 × 인원).
       ⚠ 여기서 할인·계수 같은 것을 얹지 않는다. 패키지는 대리점가 그대로다 —
         화면이 다른 규칙을 쓰기 시작하면 그게 곧 「엔진을 태우는」 첫걸음이다. */
      + '<div class="pk-total" id="pkTotal" aria-live="polite"></div>'
      /* 🔴 이름·연락처 (WF) — 예전에는 인원만 받고 견적서를 내줬다. 그래서 고객이
         견적서를 받아 가고 조용히 있으면 **누구인지도 모르고 먼저 연락할 수도 없었다.**
         대장에는 상품명이 「고객」으로 찍히고 연락처는 빈칸이었다.
         WC가 연락처를 세 입구(고객 계산기·담당자 견적 도구·관리자 발급)에 넣었는데
         **이 네 번째 입구가 빠져 있었다** — 그런데 여기가 패키지의 주력 경로다.
         ⚠ 「견적서에는 표시되지 않습니다」를 **먼저** 말한다. 안 말하면 고객은
           연락처가 문서에 박히는 줄 알고 안 적는다(WC에서 세운 규칙 그대로). */
      + '<div class="pk-lead">'
      +   '<label for="pkName">받으실 분 <b>*</b></label>'
      +   '<input type="text" id="pkName" placeholder="예: 김보균 · ○○교회 김집사" maxlength="80">'
      +   '<label for="pkTel">연락처 <b>*</b> <small>견적서에는 표시되지 않습니다 — 담당자 연락용입니다</small></label>'
      +   '<input type="tel" id="pkTel" placeholder="010-0000-0000" maxlength="40">'
      + '</div>'
      + '<button class="pk-cta" id="pkAsk" style="margin-top:12px">이 상품으로 견적서 받기</button>'
      + '<p id="pkAskMsg" style="margin-top:10px;font-size:12px;line-height:1.8"></p>'
      + '<p style="margin-top:6px;font-size:12px;color:var(--t-sub);line-height:1.8">'
      +   '금액은 ' + esc(fmtDate(p.priceAsOf)) + ' 기준이며 항공 좌석·현지 사정에 따라 변동될 수 있습니다.'
      + '</p>';

    document.getElementById('pkModal').classList.add('on');

    /* 인원을 바꿀 때마다 총액을 다시 적는다 — 곱셈은 서버가 하는 것과 같다 */
    var paxEl = document.getElementById('pkPax');
    var totalEl = document.getElementById('pkTotal');
    var per = perPersonOf(p);
    var drawTotal = function () {
      if (!totalEl) return;
      var n = Number(paxEl && paxEl.value);
      if (!(n >= 1 && n <= 500) || !(per > 0)) { totalEl.textContent = ''; return; }
      /* ⚠ 「1인 금액 × 인원 = 총액」을 **식 그대로** 보여 준다. 총액만 적으면
         고객이 무엇이 곱해진 값인지 확인할 수 없다(XE에서 배운 것: 표가 스스로
         설명하지 않으면 고객은 우리가 잘못 더한 줄 안다). */
      totalEl.innerHTML = '<span>' + won(per) + '원 × ' + n + '명</span>'
        + '<strong>' + won(per * n) + '원</strong>';
    };
    if (paxEl) {
      paxEl.addEventListener('input', drawTotal);
      paxEl.addEventListener('change', drawTotal);
    }
    drawTotal();

    var ask = document.getElementById('pkAsk');
    if (ask) {
      ask.addEventListener('click', function () {
        var msg = document.getElementById('pkAskMsg');
        var pax = Number((document.getElementById('pkPax') || {}).value);
        if (!(pax >= 1 && pax <= 500)) {
          msg.style.color = 'var(--red)';
          msg.textContent = '인원을 1~500명 사이로 넣어 주세요.';
          return;
        }
        var nm = ((document.getElementById('pkName') || {}).value || '').trim();
        var tel = ((document.getElementById('pkTel') || {}).value || '').trim();
        if (!nm) {
          msg.style.color = 'var(--red)';
          msg.textContent = '받으실 분 이름을 넣어 주세요.';
          return;
        }
        /* ⚠ 서버(`normalizeTel`)와 **같은 기준**으로 본다 — 숫자 9자 이상.
           화면이 통과시킨 값을 서버가 조용히 버리면 대장에 연락처가 안 남고,
           고객은 적었다고 생각한다(결함 생성기 ②). 형식은 조이지 않는다:
           「01012345678」·「02)123-4567」·「+82 10 …」·내선이 다 온다. */
        if (tel.replace(/\D/g, '').length < 9) {
          msg.style.color = 'var(--red)';
          msg.textContent = '연락처를 다시 확인해 주세요. (숫자 9자 이상)';
          return;
        }
        ask.disabled = true;
        msg.style.color = 'var(--t-sub)';
        msg.textContent = '견적서를 만드는 중…';
        /* ⚠ **금액을 보내지 않는다.** 상품 id와 인원만 보내고 금액·일정·기간은
           서버가 DB에서 읽어 채운다 — 위조할 값이 요청에 없어야 검증도 필요 없다.
           (`api/quote-shares.js`의 issuePackageShare 머리말 참고) */
        fetch('/api/quote-shares?action=package', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          /* 🔴 연락처는 payload가 아니라 **바깥 칸**으로 보낸다(WC) — 서버가 대장
             컬럼에만 저장한다. 이름도 마찬가지로 대장 「고객」 칸으로 간다. */
          body: JSON.stringify({
            packageId: p.id, pax: pax, customerName: nm, customerTel: tel,
          }),
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (o) {
            if (!o.ok || !o.j || !o.j.id) {
              /* 왜 안 됐는지를 그대로 말한다 — 「실패」로 뭉뚱그리면 고객이 다시 시도만 한다.
               🔴 **세어 보니 이 표는 넷인데 서버는 여덟을 낸다**(XH). 나머지 넷은 전부
                 「문의해 주시면」으로 떨어지고 있었다. 그중 `quote_no_failed`는
                 **다시 누르면 되는 것**(견적번호를 못 딴 것)인데 고객을 문의로 보냈다 —
                 고객은 기다리고 우리는 응대 한 건을 더 받는다. 둘 다 손해다.
               ⚠ 코드 목록이 서버·이 화면·관리자 화면 **세 곳**에 흩어져 있다(결함 생성기 ①).
                 `ai-loop/test_xH_reject_voice.js`가 서버 파일에서 목록을 뽑아 두 화면과
                 대조하므로, 새 코드를 만들고 여기 안 적으면 거기서 걸린다. */
              var soon = '잠시 문제가 있었습니다 — 조금 뒤 다시 눌러 주세요. 계속 안 되면 문의해 주세요.';
              var why = {
                package_not_available: '이 상품은 지금 판매하지 않습니다. 다른 상품을 보시거나 문의해 주세요.',
                invalid_pax: '인원을 다시 확인해 주세요.',
                /* 화면이 먼저 막으므로 여기까지 오면 안 되지만, **오면 그대로 말한다** —
                   「견적서를 만들지 못했습니다」로 뭉뚱그리면 고객은 다시 누르기만 한다. */
                tel_required: '연락처를 넣어 주세요. 견적서에는 표시되지 않습니다.',
                invalid_package_id: '상품 주소가 올바르지 않습니다. 목록에서 다시 골라 주세요.',
                /* ⚠ 아래 셋은 **우리 쪽이 잠깐 안 된 것**이라 다시 누르면 된다.
                   문구를 한 곳에 두는 이유는 셋이 같은 말을 해야 하기 때문이다 —
                   따로 적으면 언젠가 하나만 고쳐진다. */
                package_lookup_failed: soon,
                quote_no_failed: soon,
                insert_failed: soon,
                /* 이건 다시 눌러도 안 된다 — 상품에 금액이 없다. 고객이 할 수 있는 게
                   없으니 다른 상품이나 문의로 보낸다. **같은 코드라도 관리자 화면에는
                   「금액을 채우고 저장하세요」로 나간다** — 고칠 수 있는 사람이 다르다. */
                package_price_broken: '이 상품은 지금 금액이 준비되지 않았습니다. 다른 상품을 보시거나 문의해 주세요.',
                /* ⚠ `unauthorized`·`session_check_failed`는 **일부러 아래 폴백으로 보낸다.**
                   1회용(adhoc) 견적을 고객이 주소로 찔렀을 때만 나오는데, 고객이 할 수
                   있는 일이 「문의」밖에 없다. 빠뜨린 게 아니라 정한 것이다(검사가 센다). */
              }[(o.j || {}).error] || '견적서를 만들지 못했습니다. 문의해 주시면 담당자가 바로 도와드립니다.';
              msg.style.color = 'var(--red)';
              msg.textContent = why;
              ask.disabled = false;
              return;
            }
            location.href = 'estimate-view.html?id=' + encodeURIComponent(o.j.id);
          })
          .catch(function () {
            msg.style.color = 'var(--red)';
            msg.textContent = '견적서를 만들지 못했습니다. 문의해 주시면 담당자가 바로 도와드립니다.';
            ask.disabled = false;
          });
      });
    }
  }

  document.getElementById('pkModal').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.close) this.classList.remove('on');
  });

  /* ⚠ 서버가 이미 「판매중 + 기한 안 지남」으로 걸러 준다. 화면에서 또 거르지 않는다 —
     두 곳에서 거르면 규칙이 갈라지고, 어느 쪽이 진실인지 알 수 없어진다. */
  /* 🔴 **못 불러온 것과 없는 것은 다른 말이다** (XX). 예전에는 500이든 네트워크 끊김이든
     `{packages: []}`로 바꿔 버려서, 화면이 「지금 준비된 패키지 상품이 없습니다」라고
     말했다. 고객은 **우리가 파는 게 없다고 믿고 나간다.** 실제로는 목록을 못 받은 것이다.
   ⚠ 200인데 `packages`가 배열이 아닌 경우도 우리 쪽 문제로 본다 — 「없다」고 말할
     근거가 없다. 진짜 빈 목록(`{packages: []}`)만 「없습니다」다. */
  fetch('/api/content?action=packages')
    .then(function (r) {
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    })
    .then(function (d) {
      if (!d || !Array.isArray(d.packages)) throw new Error('shape');
      ALL = d.packages;
      LOAD_FAILED = false;
      renderFilters();
      render();
    })
    .catch(function () {
      LOAD_FAILED = true;
      ALL = [];
      renderFilters();
      render();
    });
})();
</script>
</body>
</html>
